[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-defect-diffusion"
version = "0.0.0"
description = "Planning scaffold for industrial defect diffusion research"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.17.3", "PyYAML==6.0.3", "pre-commit==4.7.0", "pytest==9.0.2"]
audit = ["Pillow==13.0.0"]
quality = ["torch-fidelity==0.3.0"]
reporting = ["matplotlib==3.11.2"]
presentation = [
    "fastapi==0.121.3",
    "uvicorn==0.38.0",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
]
lora = [
    "diffusers==0.43.0",
    "transformers==5.22.2",
    "peft==0.21.3",
    "accelerate==1.15.0",
    "safetensors==0.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
