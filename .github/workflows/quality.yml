name: Foundation quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CUDA_VISIBLE_DEVICES: ''
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install lightweight development tools
        run: python -m pip install -e '.[dev,audit]'
      - name: Check installed dependencies
        run: python -m pip check
      - name: Validate foundation
        run: python scripts/check_foundation.py
      - name: Lint Python
        run: python -m ruff check .
      - name: Check Python formatting
        run: python -m ruff format --check .
      - name: Test CPU contracts with local fixtures
        run: python -m pytest -q --strict-config --strict-markers
