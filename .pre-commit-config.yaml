repos:
  - repo: local
    hooks:
      - id: foundation
        name: Foundation contracts and local links
        entry: python scripts/check_foundation.py
        language: system
        pass_filenames: false
      - id: ruff-check
        name: Ruff lint
        entry: python -m ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: python -m ruff format --check
        language: system
        types: [python]
